    <section
      class="section error-404 min-vh-100 d-flex flex-column align-items-center justify-content-center text-center"
    >
      <div class="error-icon mb-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="80"
          height="80"
          fill="#6c757d"
          viewBox="0 0 16 16"
        >
          <path
            d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.146.146 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.163.163 0 0 1-.054.06.116.116 0 0 1-.066.017H1.146a.115.115 0 0 1-.066-.017.163.163 0 0 1-.054-.06.176.176 0 0 1 .002-.183L7.884 2.073a.147.147 0 0 1 .054-.057zm1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566z"

      <h1 class="text-secondary">404</h1>
      <h2 class="fs-4 mb-4">La page que vous recherchez n'existe pas.</h2>

      <div class="d-flex gap-3">
        <button
          class="btn btn-outline-secondary"
          (click)="goBack()"
        >
          <i class="bi bi-arrow-left me-2"></i>Retour
        </button>
        <a
          href="/index"
          class="btn btn-secondary"
        >
          <i class="bi bi-house me-2"></i>Accueil
        </a>
      </div>

      <img
        src="assets/img/not-found.svg"
        class="img-fluid py-5"
        alt="Page introuvable"
        style="max-height: 300px"
      />

      <div class="rights text-muted mt-4">
        <p>Tous les droits sont réservés à <strong>Carbotrack</strong></p>
      </div>
    </section>
  </div>
</main>
