<app-navbar></app-navbar>
<app-sidebar></app-sidebar>

<main id="main" class="main">
  <div class="container">
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><i class="bi bi-house-door"></i></li>
        <li class="breadcrumb-item">Gestion des crédits</li>
        <li class="breadcrumb-item active">Liste des Vehicules</li>
      </ol>
    </nav>
    <div class="pagetitle d-flex justify-content-between align-items-center">
      <h2 style="color: rgb(7, 7, 128);">Gestion des Véhicules</h2>
      <button class="btn btn-success" (click)="openAddModal()">
        <i class="bi bi-plus-circle"></i> Ajouter Véhicule
      </button>
    </div>

    <!-- Filtres -->
    <div class="row mb-3">
      <div class="col-md-4">
        <input
          type="text"
          class="form-control"
          placeholder="Rechercher par immatriculation ou username"
          [(ngModel)]="searchTerm"
          (input)="filterVehicules()"
        />
      </div>
      <div class="col-md-2">
        <input
          type="number"
          class="form-control"
          placeholder="ID Crédit"
          [(ngModel)]="searchCreditId"
          (input)="filterVehicules()"
        />
      </div>
      <div class="col-md-3">
        <select class="form-control" [(ngModel)]="selectedType" (change)="filterVehicules()">
          <option value="">Tous les types</option>
          <option value="voiture">Voiture</option>
          <option value="camion">Camion</option>
          <option value="bus">Bus</option>
          <option value="moto">Moto</option>
        </select>
      </div>
    </div>

    <!-- Tableau des véhicules -->
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Nom Complet</th>
          <th>Immatriculation</th>
          <th>Marque</th>
          <th>Type</th>
          
          <th>QR Code</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let vehicule of paginatedVehicules()">
          <td>{{ vehicule.username }}</td>
          <td>{{ vehicule.immatriculation }}</td>
          <td>{{ vehicule.marque }}</td>
          <td>{{ vehicule.type_vehicule }}</td>
          
          <td class="text-center">
            <button class="btn btn-outline-dark" (click)="viewQrCode(vehicule.qr_code)">Voir</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <nav *ngIf="totalPages > 1">
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <a class="page-link" (click)="changePage(currentPage - 1)">Précédent</a>
        </li>
        <li
          class="page-item"
          *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="i + 1 === currentPage"
        >
          <a class="page-link" (click)="changePage(i + 1)">{{ i + 1 }}</a>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <a class="page-link" (click)="changePage(currentPage + 1)">Suivant</a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Modal d'ajout de véhicule -->
  <div *ngIf="isModalOpen" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Ajouter Véhicule</h5>
        <button class="btn-close" (click)="closeModal()">X</button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="addVehicule()">
          <div class="form-group mb-3">
            <label>ID Crédit :</label>
            <input type="number" [(ngModel)]="selectedVehicule.id_credit" name="id_credit" class="form-control" required />
          </div>
          <div class="form-group mb-3">
            <label>Immatriculation :</label>
            <input type="text" [(ngModel)]="selectedVehicule.immatriculation" name="immatriculation" class="form-control" required />
          </div>
          <div class="form-group mb-3">
            <label>Marque :</label>
            <input type="text" [(ngModel)]="selectedVehicule.marque" name="marque" class="form-control" required />
          </div>
          <div class="form-group mb-3">
            <label>Type :</label>
            <select [(ngModel)]="selectedVehicule.type_vehicule" name="type_vehicule" class="form-control" required>
              <option value="voiture">Voiture</option>
              <option value="camion">Camion</option>
              <option value="bus">Bus</option>
              <option value="moto">Moto</option>
            </select>
          </div>
          <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
<!-- Modal QR Code -->
<div *ngIf="isQrCodeModalOpen" class="modal-overlay">
  <div class="modal-content centered-modal">
    <div class="modal-header">
      <h5 class="modal-title">QR Code</h5>
      <button class="btn-close" (click)="closeQrCodeModal()">X</button>
    </div>
    <div class="modal-body text-center">
      <img #qrCodeRef [src]="selectedQrCode" alt="QR Code" class="img-fluid qr-large" />
      <div class="mt-3">
        <button class="btn btn-primary mt-3" (click)="printQrCode(qrCodeRef)">Imprimer</button>
      </div>
    </div>
  </div>
</div>

</main>

<app-footer></app-footer>
<a href="#" class="back-to-top d-flex align-items-center justify-content-center">
  <i class="bi bi-arrow-up-short"></i>
</a>
