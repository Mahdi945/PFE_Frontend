<div class="container">
  <section
    class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
          <!-- Carte du formulaire -->
          <div class="card mb-4 shadow-lg">
            <div class="card-body p-4 p-md-5">
              <div class="text-center pb-4">
                <!-- Logo -->
                <div class="logo-container mb-4">
                  <a
                    href="/"
                    class="d-inline-block"
                  >
                    <img
                      src="logo.png"
                      alt="Logo"
                      class="img-fluid"
                      style="height: 70px; width: auto"
                    />
                  </a>
                </div>

                <!-- Titres -->
                <h2 class="card-title fw-bold mb-2">Réinitialisation de mot de passe</h2>
                <p class="text-muted">
                  Entrez votre email pour recevoir le lien de réinitialisation
                </p>
              </div>

              <form
                [formGroup]="forgotPasswordForm"
                (ngSubmit)="onRequestPasswordReset()"
                class="needs-validation"
                novalidate
              >
                <!-- Champ Email -->
                <div class="mb-4">
                  <label
                    for="email"
                    class="form-label fw-semibold"
                    >Email</label
                  >
                  <div class="input-group border rounded-3">
                    <span class="input-group-text bg-transparent border-0">&#64;</span>
                    <input
                      type="email"
                      formControlName="email"
                      class="form-control border-0 py-2 px-3"
                      id="email"
                      placeholder="votre@email.com"
                      required
                    />
                  </div>
                  <div
                    *ngIf="emailControl?.invalid && emailControl?.touched"
                    class="text-danger small mt-1"
                  >
                    Veuillez entrer un email valide.
                  </div>
                </div>

                <!-- Message d'état -->
                <div
                  *ngIf="message"
                  class="alert alert-dismissible fade show mb-4 rounded-3"
                  [ngClass]="{ 'alert-success': !isError, 'alert-danger': isError }"
                >
                  {{ message }}
                  <button
                    type="button"
                    class="btn-close"
                    (click)="message = ''"
                  ></button>
                </div>
                <!-- Bouton de soumission -->
                <button
                  class="btn btn-primary w-100 py-2 rounded-pill fw-semibold"
                  type="submit"
                  [disabled]="forgotPasswordForm.invalid || isLoading"
                  [class.btn-disabled]="forgotPasswordForm.invalid"
                >
                  <span
                    *ngIf="!isLoading"
                    class="d-flex align-items-center justify-content-center"
                  >
                    <i class="bi bi-envelope-arrow-up me-2"></i>
                    Envoyer le lien
                  </span>
                  <span
                    *ngIf="isLoading"
                    class="d-flex align-items-center justify-content-center"
                  >
                    <span
                      class="spinner-border spinner-border-sm me-2"
                      role="status"
                      aria-hidden="true"
                    ></span>
                    Envoi en cours...
                  </span>
                </button>

                <!-- Lien de redirection vers la page de login -->
                <div class="login-link-container text-center">
                  <p class="login-link-text">Vous vous souvenez de votre mot de passe ?</p>
                  <a
                    routerLink="/login"
                    class="login-link"
                  >
                    <i class="bi bi-arrow-left"></i>
                    Retour à la connexion
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
