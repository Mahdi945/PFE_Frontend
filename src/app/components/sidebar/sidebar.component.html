<aside
  id="sidebar"
  class="sidebar"
  [ngClass]="{ visible: isSidebarVisible, hidden: !isSidebarVisible }"
>
  <ul
    class="sidebar-nav"
    id="sidebar-nav"
  >
    <ng-container *ngFor="let item of menuItems">
      <!-- Éléments sans enfants -->
      <li
        *ngIf="!hasVisibleChildren(item)"
        class="nav-item"
      >
        <a
          class="nav-link"
          [routerLink]="item.routerLink"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onMenuItemClick()"
        >
          <i [class]="'bi ' + item.icon"></i><span>{{ item.element_name }}</span>
        </a>
      </li>

      <!-- Éléments avec enfants -->
      <li
        *ngIf="hasVisibleChildren(item)"
        class="nav-item"
      >
        <a
          class="nav-link"
          (click)="toggleCollapse(item)"
          [class.collapsed]="item.isCollapsed"
        >
          <i [class]="'bi ' + item.icon"></i>
          <span>{{ item.element_name }}</span>
          <i [class]="'bi ms-auto ' + (item.isCollapsed ? 'bi-chevron-down' : 'bi-chevron-up')"></i>
        </a>
        <div
          [class.collapse]="item.isCollapsed"
          [id]="item.element_name + '-nav'"
        >
          <ul class="nav-content">
            <li *ngFor="let child of item.children">
              <a
                [routerLink]="child.routerLink"
                routerLinkActive="active"
                (click)="onMenuItemClick()"
              >
                <i [class]="'bi ' + child.icon + ' fs-5'"></i><span>{{ child.element_name }}</span>
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ng-container>
  </ul>

  <!-- Section spéciale : Mon compte (séparée des éléments de menu) -->
  <div class="sidebar-account-section">
    <div class="section-divider"></div>
    <div class="section-title">
      <i class="bi bi-person-gear"></i>
      <span>Mon Compte</span>
    </div>
    <ul class="account-menu">
      <li class="nav-item">
        <a class="nav-link" routerLink="/profile-utilisateur" routerLinkActive="active" (click)="onMenuItemClick()">
          <i class="bi bi-person-circle"></i>
          <span>Mon Profil</span>
        </a>
      </li>
      <li class="nav-item" *ngIf="userRole !== 'client'">
        <a class="nav-link" href="#" (click)="$event.preventDefault(); openMessagesModal()">
          <i class="bi bi-chat-dots"></i>
          <span>Messagerie</span>
          <span *ngIf="unreadMessagesCount > 0" class="badge-count">{{ unreadMessagesCount }}</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Badge utilisateur en bas de la sidebar -->
  <div class="user-profile-badge">
    <a routerLink="/profile-utilisateur" class="user-profile-link">
      <div class="user-avatar">
        <img 
          *ngIf="profilePhoto" 
          [src]="profilePhoto" 
          [alt]="user?.username"
          (error)="onImageError($event)"
        />
        <div *ngIf="!profilePhoto" class="avatar-placeholder">
          <i class="bi bi-person-fill"></i>
        </div>
      </div>
      <div class="user-info">
        <span class="user-name">{{ user?.username }}</span>
        <span class="user-role">{{ userRole | titlecase }}</span>
      </div>
    </a>
    <button class="logout-btn" (click)="onLogout()" title="Déconnexion">
      <i class="bi bi-power"></i>
    </button>
  </div>
</aside>
