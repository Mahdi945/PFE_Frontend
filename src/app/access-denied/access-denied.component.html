<main>
  <div class="container">
    <section
      class="section access-denied min-vh-100 d-flex flex-column align-items-center justify-content-center text-center"
    >
      <div class="error-icon mb-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="80"
          height="80"
          fill="#dc3545"
          viewBox="0 0 16 16"
        >
          <path
            d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
          />
        </svg>
      </div>
      <h1 class="text-danger">Accès Refusé</h1>
      <h2 class="fs-4 mb-4">Vous n'avez pas les permissions nécessaires.</h2>

      <div class="d-flex gap-3">
        <button
          class="btn btn-outline-primary"
          (click)="goBack()"
        >
          <i class="bi bi-arrow-left me-2"></i>Retour
        </button>
        <a
          href="/index"
          class="btn btn-primary"
        >
          <i class="bi bi-house me-2"></i>Accueil
        </a>
      </div>

      <div class="error-image-container my-4">
        <img
          src="assets/img/access_denied.jpg"
          class="error-image img-fluid"
          alt="Accès refusé"
        />
      </div>

      <div class="rights text-muted mt-4">
        <p>Tous les droits sont réservés à <strong>Carbotrack</strong></p>
      </div>
    </section>
  </div>
</main>
