# Station Service Frontend Configuration
Listen 4201

<VirtualHost *:4201>
    ServerName vps-3b4fd3be.vps.ovh.ca
    DocumentRoot /home/almalinux/station-service-frontend
    
    <Directory /home/almalinux/station-service-frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Angular routing
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    
    # API Proxy to backend
    ProxyPreserveHost On
    ProxyPass /api http://localhost:3001/api
    ProxyPassReverse /api http://localhost:3001/api
    
    ErrorLog /var/log/httpd/station-service-error.log
    CustomLog /var/log/httpd/station-service-access.log combined
</VirtualHost>
